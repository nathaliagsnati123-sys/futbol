<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092617"/>
      <stop offset="50%" stop-color="#0f3d24"/>
      <stop offset="100%" stop-color="#06190f"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background base with subtle rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle pitch boundary lines -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="#22c55e" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Football base -->
  <circle cx="256" cy="256" r="120" fill="#ffffff" filter="url(#glow)"/>

  <!-- Classic soccer ball pentagon & panels -->
  <!-- Center pentagon -->
  <polygon points="256,204 296,233 281,280 231,280 216,233" fill="#111827"/>

  <!-- Radiating seam lines and outer black patches -->
  <line x1="256" y1="204" x2="256" y2="146" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <polygon points="256,146 226,138 240,136 256,136 272,136 286,138" fill="#111827"/>

  <line x1="296" y1="233" x2="352" y2="216" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <polygon points="352,216 368,246 376,220" fill="#111827"/>

  <line x1="281" y1="280" x2="320" y2="330" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <polygon points="320,330 354,342 342,364" fill="#111827"/>

  <line x1="231" y1="280" x2="192" y2="330" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <polygon points="192,330 170,364 158,342" fill="#111827"/>

  <line x1="216" y1="233" x2="160" y2="216" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <polygon points="160,216 136,220 144,246" fill="#111827"/>

  <!-- Border around ball -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1f2937" stroke-width="4"/>

  <!-- The Iconic PLUS (+) badge in top right -->
  <g transform="translate(340, 110)">
    <!-- Badge shadow / border -->
    <circle cx="0" cy="0" r="48" fill="#092617" stroke="#4ade80" stroke-width="4"/>
    <!-- Plus symbol -->
    <rect x="-8" y="-28" width="16" height="56" rx="8" fill="url(#plusGrad)"/>
    <rect x="-28" y="-8" width="56" height="16" rx="8" fill="url(#plusGrad)"/>
  </g>
</svg>
